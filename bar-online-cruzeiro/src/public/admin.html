<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel — Bar On-line do Cruzeiro</title>
<style>
:root{--blue:#2d6bff;--amber:#ffb020;--panel:#07102b;--line:rgba(45,107,255,.4);--muted:#9aa6c4;--foam:#f7f1e3}
*{box-sizing:border-box;margin:0}
body{background:#000;color:var(--foam);font:16px/1.45 system-ui,sans-serif;padding:16px;max-width:1000px;margin:0 auto}
h1{font-size:22px;margin-bottom:12px}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#000}
button{cursor:pointer;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
button.p{background:var(--amber);color:#1a1100;border:0;font-weight:600}
button.d{color:#ff8a8a}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button.on{background:var(--blue);border-color:var(--blue)}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--panel)}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tag{padding:2px 10px;border-radius:99px;font-size:13px;background:#000;border:1px solid var(--amber);color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.muted{color:var(--muted);font-size:14px}
.err{color:#ff8a8a;min-height:1.3em;margin-top:8px}
.photo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 12px}
.photo-preview{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line)}
.photo-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1}
.photo-controls input{max-width:280px}
a{color:#7ea6ff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel)}
.card b{display:block;font-size:24px;color:var(--amber)}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px;margin-top:10px}
.bars div{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{min-height:36px;padding:0 12px;border-radius:99px}.chips button.on{background:var(--amber);color:#1a1100;border:0}
.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.st-novo{border-color:var(--amber)}.st-cancelado{opacity:.5}
.ok{color:#6be08a}.over{color:var(--amber)}.short{color:#ff8a8a}
.result{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px;border-radius:10px;border:1px solid currentColor;margin:10px 0;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.08)}th{color:var(--muted);font-weight:500}
.rb{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:3px 0;font-size:14px}.rb i{display:block;height:12px;background:var(--blue);border-radius:6px;min-width:3px}.rb.pk i{background:var(--amber)}.rb small{grid-column:2/4;color:var(--muted);margin-top:-4px}.badge{margin-left:6px;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--amber);color:var(--amber)}
.tw{overflow-x:auto}.small{min-height:34px;padding:0 10px;font-size:14px}
.qty{font-size:34px;font-weight:700;line-height:1.1;margin:8px 0 6px}.qty span{font-size:16px;color:var(--muted);margin-left:6px;font-weight:500}
.meter{height:10px;border-radius:99px;background:#000;border:1px solid var(--line);overflow:hidden;margin-bottom:4px}.meter i{display:block;height:100%;border-radius:99px}
.m-good{background:#6be08a}.m-low{background:var(--amber)}.m-empty{background:#ff8a8a}
.tag.st-good{border-color:#6be08a;color:#6be08a}.tag.st-empty{border-color:#ff8a8a;color:#ff8a8a}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);display:grid;place-items:center;padding:16px}
.mo{width:100%;max-width:420px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}.mo label{display:grid;gap:4px}
.cnt{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:10px 0}.cnt .row{align-items:center;padding:6px 10px}.cnt input{width:96px;min-height:38px;text-align:right}.cnt h4{padding:8px 10px;background:#000;color:var(--amber);position:sticky;top:0}
@media print{body *{display:none}}
</style>
</head>
<body>
<h1>Painel — Bar On-line do Cruzeiro</h1>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let token=sessionStorage.getItem('bdc_admin')||'',tab='dash',timer,wtimer,lastMax=null,newCount=0,stockAlert=0,wt=0,ofilter='ativos',oq='';
async function api(path,opt={}){
  const r=await fetch('/api/admin/'+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&path!=='login'){token='';sessionStorage.removeItem('bdc_admin');login();throw new Error(j.error)}
  if(!r.ok)throw new Error(j.error||'Erro');return j;
}
function login(){
  clearInterval(timer);clearInterval(wtimer);wtimer=null;
  $('#app').innerHTML=`<div class="box" style="max-width:360px"><label for="pw">Senha do painel</label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="e"></div><button class="p" id="go" style="width:100%">Entrar</button></div>`;
  const go=async()=>{try{const j=await api('login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});token=j.token;sessionStorage.setItem('bdc_admin',token);shell()}catch(e){$('#e').textContent=e.message}};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
function shell(){
  $('#app').innerHTML=`<div class="tabs">${[['dash','Resumo'],['orders','Pedidos'+(newCount?' ('+newCount+')':'')],['products','Produtos'],['estoque','Estoque'+(stockAlert?' ('+stockAlert+')':'')],['brands','Marcas'],['zones','Bairros'],['reports','Relatórios'],['coupons','Cupons'],['cash','Caixa'],['settings','Funcionamento']].map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}<button id="pause" style="margin-left:auto">…</button><button id="out">Sair</button></div><div id="body"></div>`;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});
  $('#pause').onclick=togglePause;
  $('#out').onclick=()=>{clearInterval(wtimer);wtimer=null;token='';sessionStorage.removeItem('bdc_admin');login()};
  clearInterval(timer);
  if(!wtimer){watch();watchStock();wtimer=setInterval(()=>{watch();if(++wt%4===0)watchStock()},15000)}
  ({dash,orders,products,estoque,brands,zones,reports,coupons,cash,settings})[tab]();
  refreshPause();
}
const ST=['novo','preparando','saiu','entregue','cancelado'];
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(a.currentTime+.5)}catch(e){}}
async function watch(){try{const r=await api('orders');const mx=Math.max(0,...r.map(o=>o.id));
  if(lastMax!==null&&mx>lastMax){beep();document.title='🔔 Novo pedido! — Painel';if(tab==='orders')orders()}
  lastMax=mx;newCount=r.filter(o=>o.status==='novo').length;
  const t=document.querySelector('[data-t=orders]');if(t)t.textContent='Pedidos'+(newCount?' ('+newCount+')':'')}catch(e){}}
async function dash(days=7){
  const s=await api('stats?days='+days),mx=Math.max(1,...s.byDay.map(d=>d.total));
  const list=(arr,f)=>arr.length?arr.map(f).join(''):'<p class="muted">Sem dados no período.</p>';
  $('#body').innerHTML=`<div class="chips">${[[1,'Hoje'],[7,'7 dias'],[30,'30 dias']].map(p=>`<button data-d="${p[0]}" class="${p[0]===days?'on':''}">${p[1]}</button>`).join('')}</div>
  <div class="cards"><div class="card"><span class="muted">Faturamento</span><b>${brl(s.revenue)}</b></div><div class="card"><span class="muted">Pedidos</span><b>${s.orders}</b></div><div class="card"><span class="muted">Ticket médio</span><b>${brl(s.avg)}</b></div><div class="card"><span class="muted">Cancelados</span><b>${s.cancelled}</b></div></div>
  <div class="box"><b>Vendas por dia</b><div class="bars">${s.byDay.map(d=>`<div title="${d.day.split('-').reverse().slice(0,2).join('/')}: ${brl(d.total)} (${d.n} pedidos)" style="height:${Math.max(2,d.total/mx*100)}%"></div>`).join('')}</div></div>
  <div class="box"><b>Mais vendidos</b>${list(s.top,t=>`<div class="row"><span>${esc(t.name)}</span><span>${t.qty} un · ${brl(t.total)}</span></div>`)}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="box"><b>Pagamento</b>${list(s.payments,x=>`<div class="row"><span>${esc(x.name)}</span><span>${x.n}</span></div>`)}</div><div class="box"><b>Bairros</b>${list(s.zones,x=>`<div class="row"><span>${esc(x.name)}</span><span>${x.n}</span></div>`)}</div></div>`;
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>dash(+b.dataset.d));
}
function printOrder(o){const w=window.open('','_blank','width=380,height=640');if(!w)return alert('Libere pop-ups para imprimir.');
  w.document.write(`<pre style="font:14px/1.4 monospace;white-space:pre-wrap">PEDIDO #${o.id} — ${new Date(o.created_at).toLocaleString('pt-BR')}
${esc(o.customer_name)} · ${esc(o.phone)}
${esc(o.address)} (${esc(o.zone)})
--------------------------------
${o.items.map(i=>i.qty+'x '+esc(i.name)).join('\n')}
--------------------------------
${o.notes?'Obs.: '+esc(o.notes)+'\n':''}Pagamento: ${esc(o.payment)}${o.change_for?' (troco p/ '+esc(o.change_for)+')':''}
${o.discount_cents?'Cupom '+esc(o.coupon_code)+': -'+brl(o.discount_cents)+'\n':''}Entrega: ${brl(o.fee_cents)}
TOTAL: ${brl(o.total_cents)}</pre>`);w.document.close();w.focus();w.print()}
async function orders(){
  document.title='Painel — Bar On-line do Cruzeiro';
  const load=async()=>{
    const all=await api('orders');
    const cnt=s=>all.filter(o=>s==='ativos'?['novo','preparando','saiu'].includes(o.status):s==='todos'||o.status===s).length;
    const q=oq.toLowerCase();
    const rows=all.filter(o=>(ofilter==='todos'||(ofilter==='ativos'?['novo','preparando','saiu'].includes(o.status):o.status===ofilter))&&(!q||('#'+o.id+' '+o.customer_name+' '+o.phone).toLowerCase().includes(q)));
    $('#body').innerHTML=`<div class="chips">${['ativos',...ST,'todos'].map(s=>`<button data-f="${s}" class="${s===ofilter?'on':''}">${s} (${cnt(s)})</button>`).join('')}</div><input id="oq" placeholder="Buscar por nº, nome ou telefone" value="${esc(oq)}" style="margin-bottom:12px">`+
    (rows.length?rows.map(o=>{const nx=ST[ST.indexOf(o.status)+1];return `<div class="box st-${o.status}"><div class="top"><b>#${o.id} · ${esc(o.customer_name)}</b><span class="muted">${new Date(o.created_at).toLocaleString('pt-BR')}</span></div>
    <div class="muted">${esc(o.address)} — ${esc(o.zone)} · <a href="https://wa.me/55${esc(o.phone.replace(/\D/g,'').replace(/^55/,''))}">${esc(o.phone)}</a></div>
    <ul style="margin:8px 0 8px 18px">${o.items.map(i=>`<li>${i.qty}x ${esc(i.name)}</li>`).join('')}</ul>
    ${o.notes?`<div class="muted">Obs.: ${esc(o.notes)}</div>`:''}
    <div class="top" style="align-items:center"><span>${o.payment}${o.change_for?' · troco p/ '+esc(o.change_for):''} ${o.discount_cents?' · cupom '+esc(o.coupon_code)+' −'+brl(o.discount_cents):''} · entrega ${brl(o.fee_cents)} · <b>${brl(o.total_cents)}</b></span>
    <span style="display:flex;gap:6px;flex-wrap:wrap">${nx&&nx!=='cancelado'?`<button class="p" data-n="${o.id}" data-s="${nx}">→ ${nx}</button>`:''}<button data-pr="${o.id}">Imprimir</button><select data-o="${o.id}" style="width:auto">${ST.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></span></div></div>`}).join(''):'<p class="muted">Nenhum pedido nesta visão.</p>');
    document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ofilter=b.dataset.f;load()});
    $('#oq').oninput=e=>{oq=e.target.value;clearTimeout(load.t);load.t=setTimeout(()=>load().then(()=>{const i=$('#oq');i.focus();i.setSelectionRange(99,99)}),300)};
    document.querySelectorAll('[data-o]').forEach(s=>s.onchange=async()=>{await api('orders/'+s.dataset.o,{method:'PATCH',body:JSON.stringify({status:s.value})});load();watch()});
    document.querySelectorAll('[data-n]').forEach(b=>b.onclick=async()=>{await api('orders/'+b.dataset.n,{method:'PATCH',body:JSON.stringify({status:b.dataset.s})});load();watch()});
    document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>printOrder(all.find(o=>o.id==b.dataset.pr)));
  };
  await load();timer=setInterval(()=>{const a=document.activeElement;if(!a||!['SELECT','INPUT'].includes(a.tagName))load().catch(()=>{})},20000);
}
function optimizePhoto(file,max=800,png=false){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();reader.onerror=()=>reject(new Error('Não foi possível ler o arquivo.'));
    reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Arquivo de imagem inválido.'));
      img.onload=()=>{const scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');if(!png){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)}ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(png?canvas.toDataURL('image/png'):canvas.toDataURL('image/jpeg',0.8));};img.src=reader.result;};reader.readAsDataURL(file);
  });
}
async function products(){
  const rows=await api('products');
  const form=(p={})=>`<div class="grid"><input placeholder="Nome" data-f="name" value="${esc(p.name)}"><input placeholder="Categoria" data-f="category" value="${esc(p.category)}"><input placeholder="Marca (ex.: Skol)" data-f="brand" value="${esc(p.brand)}"><input placeholder="Preço (ex.: 4,50)" data-f="price" value="${p.price_cents!=null?(p.price_cents/100).toFixed(2).replace('.',','):''}"><input placeholder="Descrição" data-f="description" value="${esc(p.description)}"><input placeholder="URL da foto (opcional)" data-f="image_url" ${p.has_upload?'data-keep-image="true"':''} value="${esc(p.has_upload?'':p.image_url)}"></div>`;
  $('#body').innerHTML=`<input id="pq" placeholder="Buscar produto, marca ou categoria" style="margin-bottom:12px"><div class="box"><b>Novo produto</b>${form()}<button class="p" id="add">Adicionar</button><div class="err" id="e"></div><p class="muted">Depois de criar o produto, use a opção de foto no cartão dele para enviar uma imagem do seu computador ou celular.</p></div>`+rows.map(p=>`<div class="box" data-p="${p.id}"><b>${esc(p.name)}</b><div class="photo-row"><img class="photo-preview" data-preview src="${p.image_url&&/^https?:|^data:image|^\//.test(p.image_url)?esc(p.image_url):''}" onerror="this.style.visibility='hidden'" style="${p.image_url?'':'visibility:hidden'}"><div class="photo-controls"><input type="file" accept="image/jpeg,image/png,image/webp" data-photo aria-label="Escolher foto de ${esc(p.name)}"><button type="button" data-upload>Enviar foto</button><button type="button" data-remove-photo class="d">Remover foto</button></div></div>${form(p)}<label class="muted"><input type="checkbox" data-f="active" ${p.active?'checked':''} style="width:auto;min-height:0"> Disponível no cardápio</label><div class="top" style="margin-top:8px"><button class="p" data-save>Salvar</button><button class="d" data-del>Excluir</button></div><div class="muted" data-photo-status aria-live="polite"></div></div>`).join('');
  const read=el=>{const o={};el.querySelectorAll('[data-f]').forEach(i=>{if(i.dataset.f==='image_url'&&i.dataset.keepImage==='true')return;o[i.dataset.f]=i.type==='checkbox'?i.checked:i.value});return o};
  document.querySelectorAll('[data-f="image_url"]').forEach(i=>i.addEventListener('input',()=>delete i.dataset.keepImage));
  $('#pq').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('[data-p]').forEach(b=>{b.style.display=[...b.querySelectorAll('[data-f]')].map(i=>i.value).join(' ').toLowerCase().includes(q)?'':'none'})};
  $('#add').onclick=async()=>{try{const o=read($('#add').parentElement);o.active=true;await api('products',{method:'POST',body:JSON.stringify(o)});products()}catch(e){$('#e').textContent=e.message}};
  document.querySelectorAll('[data-p]').forEach(b=>{
    b.querySelector('[data-save]').onclick=async e=>{try{await api('products/'+b.dataset.p,{method:'PUT',body:JSON.stringify(read(b))});e.target.textContent='Salvo ✓'}catch(x){alert(x.message)}};
    b.querySelector('[data-del]').onclick=async()=>{if(confirm('Excluir este produto?')){await api('products/'+b.dataset.p,{method:'DELETE'});products()}};
    b.querySelector('[data-upload]').onclick=async e=>{
      const input=b.querySelector('[data-photo]'), file=input.files?.[0], status=b.querySelector('[data-photo-status]');
      if(!file){status.textContent='Escolha uma foto primeiro.';return}
      if(!['image/jpeg','image/png','image/webp'].includes(file.type)){status.textContent='Use uma imagem JPG, PNG ou WebP.';return}
      try{
        status.textContent='Preparando imagem…';
        const imageData=await optimizePhoto(file);
        await api('products/'+b.dataset.p+'/image',{method:'PUT',body:JSON.stringify({image_data:imageData})});
        const preview=b.querySelector('[data-preview]');preview.src=imageData;preview.style.visibility='visible';
        b.querySelector('[data-f="image_url"]').dataset.keepImage='true';
        status.textContent='Foto enviada e salva no banco de dados ✓';
      }catch(x){status.textContent=x.message||'Não foi possível enviar a foto.'}
    };
    b.querySelector('[data-remove-photo]').onclick=async()=>{
      if(!confirm('Remover a foto enviada deste produto?'))return;
      try{await api('products/'+b.dataset.p+'/image',{method:'DELETE'});b.querySelector('[data-preview]').style.visibility='hidden';b.querySelector('[data-preview]').removeAttribute('src');b.querySelector('[data-f="image_url"]').value='';b.querySelector('[data-f="image_url"]').dataset.keepImage='true';b.querySelector('[data-photo-status]').textContent='Foto removida.'}catch(x){alert(x.message)}
    };
  });
}
async function brands(){
  const j=await fetch('/api/config').then(r=>r.json());
  $('#body').innerHTML=`<div class="box"><b>Marca</b><div class="grid"><input id="bn" placeholder="Nome (ex.: Skol)"><input id="bl" placeholder="URL da logo (opcional)"><input id="bk" placeholder="Cor (ex.: #f2d21c)"></div><button class="p" id="ba">Salvar marca</button><div class="err" id="e"></div><p class="muted">Se a marca já existir, ela é atualizada. Sem logo, aparece um selo colorido com as iniciais. Depois de salvar a marca, envie a logo pelo cartão dela (JPG, PNG ou WebP). No cadastro do produto, escreva o mesmo nome da marca.</p></div>`+j.brands.map(b=>`<div class="box" data-br="${b.id}"><div class="top" style="align-items:center"><span><b>${esc(b.name)}</b> <span class="muted">${esc(b.color)}</span></span><button class="d" data-b="${b.id}">Excluir marca</button></div><div class="photo-row"><img class="photo-preview" data-lp src="${b.logo_url?esc(b.logo_url):''}" onerror="this.style.visibility='hidden'" style="${b.logo_url?'':'visibility:hidden'}"><div class="photo-controls"><input type="file" accept="image/jpeg,image/png,image/webp" data-lf aria-label="Escolher logo de ${esc(b.name)}"><button type="button" data-lu>Enviar logo</button><button type="button" class="d" data-lr>Remover logo</button></div></div><div class="muted" data-ls aria-live="polite"></div></div>`).join('');
  $('#ba').onclick=async()=>{try{await api('brands',{method:'POST',body:JSON.stringify({name:$('#bn').value,logo_url:$('#bl').value,color:$('#bk').value})});brands()}catch(e){$('#e').textContent=e.message}};
  document.querySelectorAll('[data-br]').forEach(box=>{
    const id=box.dataset.br,st=box.querySelector('[data-ls]'),pv=box.querySelector('[data-lp]');
    box.querySelector('[data-lu]').onclick=async()=>{const f=box.querySelector('[data-lf]').files?.[0];
      if(!f){st.textContent='Escolha uma imagem primeiro.';return}
      if(!['image/jpeg','image/png','image/webp'].includes(f.type)){st.textContent='Use uma imagem JPG, PNG ou WebP.';return}
      try{st.textContent='Preparando logo…';const d=await optimizePhoto(f,256,true);await api('brands/'+id+'/logo',{method:'PUT',body:JSON.stringify({image_data:d})});pv.src=d;pv.style.visibility='visible';st.textContent='Logo atualizada ✓'}catch(x){st.textContent=x.message||'Não foi possível enviar a logo.'}};

const WD=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const PAYN={dinheiro:'Dinheiro',pix:'Pix',cartao:'Cartão'};
function repRows(items,key,label,sub,peakKey){
  if(!items.length)return '<p class="muted">Sem pedidos no período.</p>';
  const mx=Math.max(1,...items.map(x=>x[key])),pk=items.reduce((a,x)=>x[key]>a[key]?x:a,items[0]);
  return items.map(x=>`<div class="rb ${x===pk&&peakKey?'pk':''}"><span>${label(x)}</span><div><i style="width:${Math.max(3,x[key]/mx*100)}%"></i></div><b>${sub(x)}${x===pk&&peakKey?`<span class="badge">${peakKey}</span>`:''}</b></div>`).join('');
}

  <div class="box"><b>Dias da semana</b>${pkD?`<p class="muted">Dia mais movimentado: <b>${WD[pkD.dow]}</b> (${pkD.orders} pedido(s)).</p>`:''}${repRows(d.weekdays,'orders',x=>WD[x.dow].slice(0,3),x=>x.orders+' · '+brl(x.revenue),'mais movimentado')}</div>
  <div class="box"><b>Formas de pagamento</b>${d.payments.length?d.payments.map(x=>`<div class="row"><span>${esc(PAYN[x.payment]||x.payment)}</span><span>${x.orders} pedido(s) · ${brl(x.revenue)}</span></div>`).join(''):'<p class="muted">Sem pedidos no período.</p>'}</div>`;

/* ---------- Caixa ---------- */
const KIND={suprimento:'Entrada de dinheiro',sangria:'Retirada (sangria)',despesa:'Despesa paga do caixa'};
const METHODS=['Dinheiro','Pix','Cartão'];
let cashLast=null;
function toCents(t){const raw=String(t??'').trim().replace(/^R\$\s*/i,'');const n=/,/.test(raw)?raw.replace(/\./g,'').replace(',','.'):raw;
  return /^\d+(\.\d{1,2})?$/.test(n)?Math.round(Number(n)*100):null}
const when=d=>new Date(d).toLocaleString('pt-BR');
const diffTxt=c=>+c===0?'Caixa batendo ✓':+c>0?'Sobrou '+brl(c):'Faltou '+brl(-c);
const diffCls=c=>+c===0?'ok':+c>0?'over':'short';
function cashSummary(s){
  const rows=Object.entries(s.byMethod||{}).filter(([m,v])=>METHODS.includes(m)||v.orders>0).map(([m,v])=>`<tr><td>${esc(m)}</td><td>${v.orders}</td><td>${brl(v.totalCents)}</td></tr>`).join('');
  return `<div class="cards"><div class="card"><span class="muted">Troco inicial</span><b>${brl(s.openingCents)}</b></div><div class="card"><span class="muted">Vendas em dinheiro</span><b>${brl(s.cashSalesCents)}</b></div><div class="card"><span class="muted">Entradas / retiradas / despesas</span><b style="font-size:16px">+${brl(s.suppliesCents)} / −${brl(s.withdrawalsCents)} / −${brl(s.expensesCents)}</b></div><div class="card" style="border-color:var(--amber)"><span class="muted">Dinheiro que deve ter no caixa</span><b>${brl(s.expectedCashCents)}</b></div></div>
  <div class="tw"><table><thead><tr><th>Forma de pagamento</th><th>Pedidos</th><th>Total</th></tr></thead><tbody>${rows}<tr><td><b>Total vendido</b></td><td><b>${s.totalOrders}</b></td><td><b>${brl(s.totalSalesCents)}</b></td></tr></tbody></table></div>`;
}
function cashMoves(list,canDel){
  if(!list.length)return '<p class="muted">Nenhum lançamento ainda.</p>';
  return `<div class="tw"><table><thead><tr><th>Hora</th><th>Tipo</th><th>Motivo</th><th>Valor</th><th></th></tr></thead><tbody>${list.map(m=>`<tr><td>${when(m.created_at)}</td><td>${KIND[m.kind]||m.kind}</td><td>${esc(m.reason)}</td><td>${m.kind==='suprimento'?'+':'−'}${brl(m.amount_cents)}</td><td>${canDel?`<button class="d small" data-cdel="${m.id}">Desfazer</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;
}
function cashReport(r,title){
  const s=r.session;
  return `<div class="box"><b>${esc(title)}</b><p class="muted">Aberto em ${when(s.opened_at)} por ${esc(s.opened_by)}${s.closed_at?' · Fechado em '+when(s.closed_at)+' por '+esc(s.closed_by):''}</p>${cashSummary(r.summary)}
  ${s.closed_at?`<div class="result ${diffCls(s.difference_cents)}"><span>Esperado ${brl(s.expected_cents)} · Contado ${brl(s.counted_cents)}</span><span>${diffTxt(s.difference_cents)}</span></div>${s.open_notes?`<p class="muted">Obs. na abertura: ${esc(s.open_notes)}</p>`:''}${s.close_notes?`<p class="muted">Obs. no fechamento: ${esc(s.close_notes)}</p>`:''}`:''}
  <b>Lançamentos</b>${cashMoves(r.movements,false)}<button data-cprint="${s.id}" style="margin-top:8px">🖨️ Imprimir relatório</button></div>`;
}
function printCash(r){
  const s=r.session,m=r.summary,ln=(a,b)=>`${String(a).padEnd(18)}${String(b).padStart(14)}`;
  const meth=Object.entries(m.byMethod||{}).filter(([k,v])=>METHODS.includes(k)||v.orders>0).map(([k,v])=>ln(k+' ('+v.orders+')',brl(v.totalCents))).join('\n');

RELATÓRIO DE CAIXA
--------------------------------
Abertura: ${when(s.opened_at)}
${esc(s.opened_by)}
${s.closed_at?'Fechamento: '+when(s.closed_at)+'\n'+esc(s.closed_by):'Caixa ainda aberto'}
--------------------------------
VENDAS
${esc(meth)}
${ln('Total vendido',brl(m.totalSalesCents))}
--------------------------------
DINHEIRO
${ln('Troco inicial',brl(m.openingCents))}
${ln('Vendas em dinheiro',brl(m.cashSalesCents))}
${ln('Entradas','+'+brl(m.suppliesCents))}
${ln('Retiradas','-'+brl(m.withdrawalsCents))}
${ln('Despesas','-'+brl(m.expensesCents))}
${ln('ESPERADO',brl(m.expectedCashCents))}${s.closed_at?'\n'+ln('Contado',brl(s.counted_cents))+'\n*** '+diffTxt(s.difference_cents)+' ***'+(s.close_notes?'\nObs.: '+esc(s.close_notes):''):''}
--------------------------------
LANÇAMENTOS

  }else{
    html+=`<div class="box"><b>🔓 Caixa aberto</b><p class="muted">Desde ${when(cur.session.opened_at)} por ${esc(cur.session.opened_by)}. Os valores contam os pedidos não cancelados desde a abertura.</p>${cashSummary(cur.summary)}</div>
    <div class="box"><b>Lançar movimento</b><div class="grid"><label class="muted">Tipo<select id="c-kind"><option value="sangria">Retirada (sangria)</option><option value="despesa">Despesa paga do caixa</option><option value="suprimento">Entrada de dinheiro</option></select></label><label class="muted">Valor (R$)<input id="c-amt" inputmode="decimal" placeholder="Ex.: 20,00"></label><label class="muted">Motivo<input id="c-reason" maxlength="200" placeholder="Ex.: compra de gelo"></label>${by}</div><button class="p" id="c-move-go">Lançar</button><div class="err" id="c-err"></div>${cashMoves(cur.movements,true)}</div>
    <div class="box"><b>Fechar caixa</b><p class="muted">Conte todo o dinheiro da gaveta e informe o valor. O sistema compara com o esperado (<b>${brl(cur.summary.expectedCashCents)}</b>).</p><div class="grid"><label class="muted">Dinheiro contado (R$)<input id="c-count" inputmode="decimal" placeholder="Ex.: 250,00"></label><label class="muted">Observação (opcional)<input id="c-cnotes" maxlength="500" placeholder="Ex.: faltou troco"></label></div><label class="muted" style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="c-pause" style="width:auto;min-height:0"> Pausar os pedidos do site ao fechar o caixa</label><button class="d" id="c-close-go">Fechar caixa</button><div class="err" id="c-err2"></div></div>`;
  }
  html+=`<h2 style="font-size:18px;margin:16px 0 8px">Caixas anteriores</h2>`+(hist.length?`<div class="box tw"><table><thead><tr><th>Aberto</th><th>Fechado</th><th>Responsável</th><th>Esperado</th><th>Contado</th><th>Resultado</th><th></th></tr></thead><tbody>${hist.map(h=>`<tr><td>${when(h.opened_at)}</td><td>${when(h.closed_at)}</td><td>${esc(h.closed_by)}</td><td>${brl(h.expected_cents)}</td><td>${brl(h.counted_cents)}</td><td class="${diffCls(h.difference_cents)}">${diffTxt(h.difference_cents)}</td><td><button class="small" data-cview="${h.id}">Ver</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nenhum caixa fechado ainda.</p>');
  $('#body').innerHTML='<div id="c-detail"></div>'+html;
  const by_=()=>{const v=($('#c-by')?.value||'').trim();if($('#c-by'))sessionStorage.setItem('bdc_by',v);return v};
  const run=(errSel,fn)=>async()=>{try{await fn()}catch(e){const el=$(errSel);if(el)el.textContent=e.message;else alert(e.message)}};
  const post=(path,body,m='POST')=>api('cash/'+path,{method:m,body:JSON.stringify(body)});
  if($('#c-open-go'))$('#c-open-go').onclick=run('#c-err',async()=>{
    const c=toCents($('#c-open').value);if(c===null)throw new Error('Digite o troco inicial em reais. Ex.: 100,00');
    cashLast=null;await post('open',{openingCents:c,notes:$('#c-onotes').value,by:by_(),resumeOrders:$('#c-resume').checked});await cash();refreshPause()});
  if($('#c-move-go'))$('#c-move-go').onclick=run('#c-err',async()=>{
    const c=toCents($('#c-amt').value);if(!c)throw new Error('Digite um valor maior que zero. Ex.: 20,00');
    await post('movements',{kind:$('#c-kind').value,amountCents:c,reason:$('#c-reason').value,by:by_()});cash()});
  if($('#c-close-go'))$('#c-close-go').onclick=run('#c-err2',async()=>{
    const c=toCents($('#c-count').value);if(c===null)throw new Error('Digite o dinheiro contado em reais. Ex.: 250,00');
    if(!confirm('Fechar o caixa agora? Depois de fechado ele não pode ser alterado.'))return;
    cashLast=await post('close',{countedCents:c,notes:$('#c-cnotes').value,by:(sessionStorage.getItem('bdc_by')||''),pauseOrders:$('#c-pause').checked});await cash();refreshPause()});
  document.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=run('',async()=>{
    if(!confirm('Desfazer este lançamento?'))return;await api('cash/movements/'+b.dataset.cdel,{method:'DELETE'});cash()}));
  document.querySelectorAll('[data-cview]').forEach(b=>b.onclick=run('',async()=>{
    const r=await api('cash/sessions/'+b.dataset.cview);$('#c-detail').innerHTML=cashReport(r,'Detalhes do caixa');
    document.querySelectorAll('[data-cprint]').forEach(x=>x.onclick=()=>printCash(r));scrollTo({top:0,behavior:'smooth'})}));
  document.querySelectorAll('[data-cprint]').forEach(x=>x.onclick=()=>printCash(cashLast));
}

/* ---------- Estoque ---------- */
async function watchStock(){try{const s=await api('estoque/summary');stockAlert=s.low+s.empty;const t=document.querySelector('[data-t=estoque]');if(t)t.textContent='Estoque'+(stockAlert?' ('+stockAlert+')':'')}catch(e){}}
const UL={un:'un.',kg:'kg',g:'g',l:'L',ml:'ml'},MV={entrada:'Compra',saida:'Retirada',perda:'Perda',conferencia:'Correção de saldo',ajuste:'Ajuste',venda:'Baixa de pedido',devolucao:'Devolução'},MS={entrada:'+',devolucao:'+',saida:'−',perda:'−',venda:'−'};
const nf=(n,max=3)=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:max});
let sFilter={q:'',st:'all'};
function stStatus(i){const q=i.quantity,cap=Math.max(i.capacity||0,q),m=i.minimum||0,p=cap>0?Math.max(0,Math.min(100,q/cap*100)):0;
  if(q<=0)return{k:'empty',l:'Esgotado',p:0};if((m>0&&q<=m)||p<=20)return{k:'low',l:'Está acabando',p};return{k:'good',l:'Estoque bom',p}}
/* Janela simples: campos + botão; erros do servidor aparecem dentro dela. */
function ask(title,fields,ok,submit){
  const d=document.createElement('div');d.className='ov';
  d.innerHTML=`<form class="mo"><b>${esc(title)}</b>${fields.map(f=>f.note?`<p class="muted">${esc(f.note)}</p>`:`<label class="muted">${esc(f.label)}${f.options?`<select name="${f.name}">${f.options.map(o=>`<option value="${esc(o[0])}" ${o[0]===f.value?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input name="${f.name}" inputmode="${f.mode||'text'}" placeholder="${esc(f.ph||'')}" value="${esc(f.value??'')}" autocomplete="off" ${f.disabled?'disabled':''}>`}</label>`).join('')}<div class="err"></div><div class="top"><button type="button" data-x>Cancelar</button><button class="p">${esc(ok)}</button></div></form>`;
  document.body.appendChild(d);
  const close=()=>d.remove(),f=d.querySelector('form'),er=d.querySelector('.err');
  d.onclick=e=>{if(e.target===d)close()};d.querySelector('[data-x]').onclick=close;
  const first=f.querySelector('input:not([disabled]),select');if(first)first.focus();
  f.onsubmit=async e=>{e.preventDefault();const btn=f.querySelector('button.p');btn.disabled=true;er.textContent='';
    try{const v={};new FormData(f).forEach((x,k)=>v[k]=x);await submit(v);close()}catch(x){er.textContent=x.message;btn.disabled=false}};
}
async function estoque(){
  document.title='Painel — Bar On-line do Cruzeiro';
  const data=await api('estoque'),items=data.items;
  const st=items.map(stStatus),low=st.filter(s=>s.k==='low').length,empty=st.filter(s=>s.k==='empty').length,spent=items.reduce((n,i)=>n+i.purchase_total_cents,0);
  stockAlert=low+empty;const tb=document.querySelector('[data-t=estoque]');if(tb)tb.textContent='Estoque'+(stockAlert?' ('+stockAlert+')':'');
  const reload=()=>estoque();
  const cardHtml=i=>{const s=stStatus(i),u=UL[i.unit]||i.unit;return `<div class="box" data-i="${i.id}">
    <div class="top"><div><b>${esc(i.name)}</b><div class="muted">${i.product_id?'Ligado ao cardápio: '+esc(i.product_name||i.name)+' — cada pedido desconta sozinho':'Controle manual (os pedidos não descontam)'}</div></div><span class="tag st-${s.k}">${s.l}</span></div>
    <div class="qty">${nf(i.quantity)}<span>${u}</span></div>
    <div class="meter"><i class="m-${s.k}" style="width:${s.p}%"></i></div><div class="muted">${Math.round(s.p)}% da quantidade cheia (${nf(Math.max(i.capacity,i.quantity))} ${u})</div>
    <div class="muted" style="margin-top:6px">Gasto em compras: <b>${brl(i.purchase_total_cents)}</b>${i.minimum>0?' · Avisar com <b>'+nf(i.minimum)+' '+u+'</b>':''}</div>
    <div class="acts"><button class="p small" data-act="buy">＋ Adicionar compra</button><button class="small" data-act="count">Corrigir saldo</button><button class="small" data-act="out">Retirar / perda</button><button class="small" data-act="edit">Editar</button><button class="small d" data-act="del">Excluir</button></div></div>`};
  const list=()=>{const q=sFilter.q.trim().toLowerCase(),r=items.filter(i=>(!q||i.name.toLowerCase().includes(q))&&(sFilter.st==='all'||stStatus(i).k===sFilter.st));
    $('#stl').innerHTML=!items.length?'<p class="muted">Nenhum item cadastrado. Use o formulário acima, ou “Contar vários produtos de uma vez”, para começar.</p>':r.length?r.map(cardHtml).join(''):'<p class="muted">Nenhum item encontrado com esse filtro.</p>'};
  const mv=data.movements;
  $('#body').innerHTML=`<div class="cards"><div class="card"><span class="muted">Itens cadastrados</span><b>${items.length}</b></div><div class="card"><span class="muted">Estoque acabando</span><b>${low}</b></div><div class="card"><span class="muted">Esgotados</span><b>${empty}</b></div><div class="card"><span class="muted">Gasto em compras</span><b>${brl(spent)}</b></div></div>
  <div class="box"><b>＋ Cadastrar item</b>
    <div class="grid"><label class="muted">Produto<input id="sn" list="sn-l" placeholder="Ex.: Heineken Latão" autocomplete="off"><datalist id="sn-l">${data.products.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist></label>
    <label class="muted">Unidade<select id="su"><option value="un">Unidades</option><option value="kg">Quilos (kg)</option><option value="g">Gramas (g)</option><option value="l">Litros (L)</option><option value="ml">Mililitros (ml)</option></select></label>
    <label class="muted">Quantidade agora<input id="sq0" inputmode="decimal" placeholder="Ex.: 24"></label>
    <label class="muted">Valor gasto (R$)<input id="sp" inputmode="decimal" placeholder="Opcional"></label>
    <label class="muted">Alertar quando restar<input id="sm" inputmode="decimal" placeholder="Opcional"></label></div>
    <button class="p" id="sadd">Cadastrar</button><button id="sbulk" style="margin-left:8px">Contar vários produtos de uma vez</button><div class="err" id="e"></div>
    <p class="muted">Se o nome for igual ao de um produto do cardápio, o estoque fica <b>ligado</b> a ele: cada pedido desconta as unidades na hora, o cancelamento devolve, o site avisa “Os 3 últimos!” e mostra “Esgotado” quando zera. Produto sem item aqui vende sem limite. Itens que não são vendidos (gelo, copos…) ficam só com controle manual.</p></div>
  <div id="sbk"></div>
  <div class="box"><b>O que tenho no estoque?</b><p class="muted">O medidor mostra quanto resta da quantidade cheia. Amarelo: está acabando. Vermelho: esgotado. Use “Editar” para ajustar o alerta e reiniciar o medidor.</p>
  <div class="grid" style="grid-template-columns:2fr 1fr"><input id="sf" type="search" placeholder="Buscar item…" value="${esc(sFilter.q)}"><select id="ss">${[['all','Todos'],['low','Acabando'],['empty','Esgotados'],['good','Estoque bom']].map(o=>`<option value="${o[0]}" ${o[0]===sFilter.st?'selected':''}>${o[1]}</option>`).join('')}</select></div></div>
  <div id="stl"></div>
  <div class="box"><b>Movimentações recentes</b>${mv.length?`<div class="tw"><table><thead><tr><th>Data</th><th>Item</th><th>Tipo</th><th>Quantidade</th><th>Detalhe</th></tr></thead><tbody>${mv.slice(0,40).map(m=>`<tr><td>${new Date(m.created_at).toLocaleString('pt-BR')}</td><td>${esc(m.item_name)}</td><td>${MV[m.kind]||m.kind}</td><td>${MS[m.kind]||''}${nf(m.quantity)} ${UL[m.item_unit]||''}</td><td>${esc(m.reason||'—')}${m.kind==='entrada'&&m.total_cents?' · '+brl(m.total_cents):''}${m.supplier?' · '+esc(m.supplier):''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">As movimentações aparecerão aqui.</p>'}</div>`;
  list();
  $('#sf').oninput=e=>{sFilter.q=e.target.value;list()};$('#ss').onchange=e=>{sFilter.st=e.target.value;list()};
  $('#su').onchange=()=>{$('#sq0').placeholder=$('#su').value==='un'?'Ex.: 24':'Ex.: 2,5'};
  $('#sadd').onclick=async()=>{const b=$('#sadd');b.disabled=true;$('#e').textContent='';
    try{const r=await api('estoque/items',{method:'POST',body:JSON.stringify({name:$('#sn').value,unit:$('#su').value,quantity:$('#sq0').value,purchaseTotal:$('#sp').value,minimumQuantity:$('#sm').value})});
      alert(r.linked?'Cadastrado e ligado ao produto do cardápio: cada pedido vai descontar sozinho.':'Cadastrado. Não há produto do cardápio com esse nome, então o controle é manual.');reload()}
    catch(e){$('#e').textContent=e.message;b.disabled=false}};
  $('#sbulk').onclick=()=>{
    if($('#sbk').innerHTML){$('#sbk').innerHTML='';return}
    if(!data.products.length){$('#e').textContent='Todos os produtos do cardápio já têm item de estoque.';return}
    const cats=[...new Set(data.products.map(p=>p.category))];
    $('#sbk').innerHTML=`<div class="box"><b>Contagem de vários produtos</b><p class="muted">Digite quantas unidades você tem de cada produto. <b>Deixe em branco</b> os que não quer controlar: eles continuam vendendo sem limite. Atenção: produto com quantidade <b>0</b> aparece como “Esgotado” no site.</p><div class="cnt">${cats.map(c=>`<h4>${esc(c)}</h4>`+data.products.filter(p=>p.category===c).map(p=>`<div class="row"><span>${esc(p.name)}</span><input data-bp="${p.id}" inputmode="numeric" placeholder="—" aria-label="Quantidade de ${esc(p.name)}"></div>`).join('')).join('')}</div><button class="p" id="bsave">Salvar contagem</button><button id="bcancel" style="margin-left:8px">Fechar</button><div class="err" id="be"></div></div>`;
    $('#bcancel').onclick=()=>{$('#sbk').innerHTML=''};
    $('#bsave').onclick=async()=>{const rows=[...document.querySelectorAll('[data-bp]')].filter(i=>i.value.trim()!=='').map(i=>({productId:+i.dataset.bp,quantity:i.value}));
      try{const r=await api('estoque/bulk',{method:'POST',body:JSON.stringify({rows})});alert(r.created+' item(ns) cadastrado(s).');reload()}catch(e){$('#be').textContent=e.message}};
  };
  const byId=id=>items.find(i=>String(i.id)===String(id));
  $('#stl').onclick=e=>{const btn=e.target.closest('[data-act]');if(!btn)return;const item=byId(btn.closest('[data-i]').dataset.i);if(!item)return;
    const u=UL[item.unit]||item.unit,mode=item.unit==='un'?'numeric':'decimal',mvPost=(type,v)=>api('estoque/movements',{method:'POST',body:JSON.stringify({itemId:item.id,type,...v})}).then(reload);
    ({buy:()=>ask('Adicionar compra — '+item.name,[{name:'quantity',label:'Quantidade comprada ('+u+')',mode,ph:'Ex.: 24'},{name:'totalPaid',label:'Valor pago no total (R$)',mode:'decimal',ph:'Opcional'},{name:'supplier',label:'Fornecedor',ph:'Opcional'}],'Adicionar',v=>mvPost('entrada',v)),
      count:()=>ask('Corrigir saldo — '+item.name,[{note:'Informe quanto existe de verdade agora. A diferença entra no histórico como conferência, sem contar como compra.'},{name:'quantity',label:'Quantidade atual ('+u+')',mode,value:item.quantity},{name:'reason',label:'Observação',ph:'Opcional'}],'Corrigir',v=>mvPost('conferencia',v)),
      out:()=>ask('Retirar / perda — '+item.name,[{name:'type',label:'O que aconteceu',options:[['saida','Retirada (uso ou consumo do bar)'],['perda','Perda (quebra, vencimento)']]},{name:'quantity',label:'Quantidade ('+u+')',mode},{name:'reason',label:'Observação',ph:'Opcional'}],'Registrar',v=>{const t=v.type;delete v.type;return mvPost(t,v)}),
      edit:()=>ask('Editar — '+item.name,[{name:'name',label:'Nome',value:item.name},{name:'unit',label:'Unidade',value:item.unit,options:item.product_id?[['un','Unidades (ligado ao cardápio)']]:[['un','Unidades'],['kg','Quilos (kg)'],['g','Gramas (g)'],['l','Litros (L)'],['ml','Mililitros (ml)']]},{name:'minimum',label:'Alertar quando restar ('+u+')',mode:'decimal',value:item.minimum||''},{name:'capacity',label:'Quantidade cheia = 100% do medidor',mode:'decimal',value:Math.max(item.capacity,item.quantity)},{note:'Trocar kg↔g ou L↔ml converte o saldo automaticamente.'}],'Salvar',v=>api('estoque/items/'+item.id,{method:'PATCH',body:JSON.stringify(v)}).then(reload)),
      del:async()=>{if(!confirm('Excluir “'+item.name+'” do estoque? O histórico fica guardado e o produto volta a vender sem controle.'))return;try{await api('estoque/items/'+item.id,{method:'DELETE'});reload()}catch(x){alert(x.message)}}
    })[btn.dataset.act]()};
}
token?shell():login();
</script>
