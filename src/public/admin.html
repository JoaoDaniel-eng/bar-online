<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel — Bar On-line do Cruzeiro</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2d6bff;--blue-soft:#7ea6ff;--amber:#ffb020;--panel:#07102b;--panel2:#0b1638;--line:rgba(45,107,255,.38);--muted:#9aa6c4;--foam:#f7f1e3;--bg:#02050f}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:radial-gradient(1200px 500px at 50% -120px,rgba(45,107,255,.16),transparent 70%),var(--bg);color:var(--foam);font:15px/1.45 Poppins,system-ui,sans-serif;min-height:100vh}
h1{font-size:34px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.45)}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px}
input[type=checkbox]{accent-color:var(--blue)}
button{cursor:pointer;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:14px;transition:filter .15s,transform .05s}
button:hover{filter:brightness(1.25)}button:active{transform:translateY(1px)}
button.p{background:var(--blue);color:#fff;border:0}
button.d{color:#ff9aa5;background:rgba(167,46,67,.18);border-color:rgba(255,107,120,.45)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.site-top{display:flex;align-items:center;gap:12px;padding:14px max(20px,calc((100% - 1240px)/2));border-bottom:1px solid var(--line);background:rgba(0,0,0,.5);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
.site-top img{width:38px;height:38px;border-radius:50%;border:1px solid var(--line)}
.site-top b{font-size:19px;font-weight:700;flex:1}.site-top b span{color:var(--blue-soft)}
.store-link{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 24px;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;text-decoration:none;box-shadow:0 6px 24px rgba(45,107,255,.35);white-space:nowrap}
.store-link:hover{filter:brightness(1.15)}
.wrap{max-width:1240px;margin:0 auto;padding:36px 20px 60px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
.head-actions button{min-height:52px;border-radius:14px;background:var(--panel)}
.head-actions button.d{background:#b3334a;color:#fff;border-color:rgba(255,255,255,.12)}
.head-actions button.p{background:var(--blue);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:26px}
.kpi{padding:22px 24px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.kpi span{display:block;font-size:13px;color:var(--muted)}.kpi strong{display:block;font-size:30px;font-weight:700;margin:6px 0 4px;color:#fff}.kpi small{color:var(--muted);font-size:13px}
.kpi.warn strong{color:var(--amber)}
.tabs{display:flex;gap:10px;margin-bottom:22px;overflow-x:auto;padding-bottom:12px;scrollbar-color:var(--line) transparent;scrollbar-width:thin}
.tabs button{flex:none;min-height:46px;padding:0 20px;border-radius:14px;background:var(--panel)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 18px rgba(45,107,255,.4)}
.box{border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.login-box{max-width:400px;margin:8vh auto 0;padding:28px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,var(--panel2),var(--panel));display:grid;gap:12px}
.login-box h2{font-size:22px}
.panel-card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:24px}
.panel-card h2{font-size:22px;font-weight:700}
.tw{overflow-x:auto}
.otable{width:100%;border-collapse:collapse;font-size:14px;min-width:860px}
.otable th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.otable td{padding:16px 12px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:top}
.otable tr.st-cancelado{opacity:.5}.otable tr.st-novo td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.otable .code{font-weight:700;font-size:15px}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12.5px;font-weight:600;border:1px solid currentColor;text-transform:capitalize}
.pill.novo{color:var(--amber);background:rgba(255,176,32,.12)}.pill.preparando{color:#7ea6ff;background:rgba(45,107,255,.15)}.pill.saiu{color:#c79cff;background:rgba(160,100,255,.14)}.pill.entregue{color:#6be08a;background:rgba(36,163,106,.16)}.pill.cancelado{color:#ff9aa5;background:rgba(217,74,85,.14)}
.oact{display:grid;gap:8px;min-width:150px}.oact select{min-height:40px}.oact .r{display:flex;gap:8px}.oact .r button{min-height:36px;padding:0 12px;flex:1;white-space:nowrap;text-transform:capitalize}.oact .r{flex-wrap:wrap}
.ofilters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}.ofilters input{flex:1 1 260px;width:auto}.ofilters select{width:auto;min-width:170px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tag{padding:2px 10px;border-radius:99px;font-size:13px;background:#000;border:1px solid var(--amber);color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.muted{color:var(--muted);font-size:14px}
.err{color:#ff8a8a;min-height:1.3em;margin-top:8px}
.photo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 12px}
.photo-preview{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line)}
.photo-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1}
.photo-controls input{max-width:280px}
a{color:var(--blue-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.card{border:1px solid var(--line);border-radius:18px;padding:16px;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.card b{display:block;font-size:24px;color:#fff}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px;margin-top:10px}
.bars div{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{min-height:38px;padding:0 16px;border-radius:99px;text-transform:capitalize}.chips button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.st-novo{border-color:var(--amber)}.st-cancelado{opacity:.5}
.ok{color:#6be08a}.over{color:var(--amber)}.short{color:#ff8a8a}
.result{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px;border-radius:10px;border:1px solid currentColor;margin:10px 0;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.08)}th{color:var(--muted);font-weight:500}
.rb{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:3px 0;font-size:14px}.rb i{display:block;height:12px;background:var(--blue);border-radius:6px;min-width:3px}.rb.pk i{background:var(--amber)}.rb small{grid-column:2/4;color:var(--muted);margin-top:-4px}.badge{margin-left:6px;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--amber);color:var(--amber)}
.tw{overflow-x:auto}.small{min-height:34px;padding:0 10px;font-size:14px}
/* Estoque (mesmo desenho do Açaí da Roça, nas cores do bar) */
.eyebrow{display:block;color:var(--blue-soft);font-size:12px;font-weight:700;letter-spacing:.14em;margin-bottom:6px}
.inv{display:grid;gap:16px}.inv-intro h2{font-size:26px;margin:2px 0}
.inv-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.inv-card h3{font-size:18px;margin-bottom:6px}.inv-card>.muted{margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{display:flex;flex-direction:column;gap:4px;padding:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,var(--panel2),var(--panel))}.stat span{font-size:13px;color:var(--muted)}.stat strong{font-size:24px;color:#fff}
.inv-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:end}.inv-form label{display:grid;gap:6px;font-weight:600;font-size:14px}.inv-form .full{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}.inv-form button{min-height:46px}
.inv-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.inv-bar input{flex:1 1 220px;min-width:0}.inv-bar select{flex:0 1 auto;width:auto;min-width:150px}
.stock-list{display:grid;gap:12px}
.stock-card{display:grid;gap:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.stock-card.is-low{border-color:var(--amber)}.stock-card.is-empty{border-color:#ff6b78}
.stock-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.stock-head h4{font-size:17px}.stock-head small{display:block;color:var(--muted);margin-top:2px;font-size:13.5px}
.stock-badge{flex:none;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:700;border:1px solid currentColor;white-space:nowrap}.stock-badge.good{color:#6be08a}.stock-badge.low{color:var(--amber)}.stock-badge.empty{color:#ff8a8a}
.stock-qty{font-size:28px;font-weight:800;line-height:1.1}.stock-qty span{font-size:16px;font-weight:600;color:var(--muted);margin-left:4px}
.stock-meter{display:grid;gap:5px}.stock-meter-track{height:10px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}.stock-meter-track i{display:block;height:100%;border-radius:99px;transition:width .2s ease}.stock-meter-track i.good{background:#24a36a}.stock-meter-track i.low{background:#e3a323}.stock-meter-track i.empty{background:#d94a55}.stock-meter small{font-size:13px;color:var(--muted)}
.stock-facts{display:flex;gap:6px 18px;flex-wrap:wrap;list-style:none;padding:0;font-size:14px;color:var(--muted)}.stock-facts strong{color:var(--foam)}
.stock-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.stock-actions button{width:100%}
.stock-empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
dialog.stock-dialog{width:min(480px,calc(100% - 28px));max-height:calc(100dvh - 28px);overflow:auto;padding:0;margin:auto;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--foam);box-shadow:0 24px 80px #000a;color-scheme:dark}
.stock-dialog::backdrop{background:#000c;backdrop-filter:blur(3px)}
.stock-dialog-form{display:grid;gap:14px;padding:22px}.stock-dialog-form h3{font-size:20px}.stock-dialog-desc{color:var(--muted);line-height:1.5}
.stock-field{display:grid;gap:6px;font-weight:700}.stock-field small{font-weight:400;color:var(--muted);line-height:1.4}.stock-field-row{display:flex;align-items:center;gap:10px}.stock-unit-tag{min-width:42px;font-weight:700}
.stock-dialog-error{color:#ff8a8a;font-weight:600}.stock-dialog-error:empty{display:none}
.stock-dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
button.danger{background:#a72e43;border:0;color:#fff;font-weight:600}
.stock-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9999;max-width:min(560px,calc(100% - 28px));padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 12px 40px #000a;background:#1f6f46;color:#fff}.stock-toast.error{background:#a72e43}.stock-toast[hidden]{display:none}
.cnt{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:10px 0}.cnt .row{align-items:center;padding:6px 10px}.cnt input{width:96px;min-height:38px;text-align:right}.cnt h4{padding:8px 10px;background:#000;color:var(--amber);position:sticky;top:0}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:28px}}
@media(max-width:620px){.wrap{padding:24px 14px 50px}.site-top{padding:12px 14px}.store-link{padding:0 16px;min-height:42px;font-size:13px}.kpis{gap:10px}.kpi{padding:16px}.kpi strong{font-size:22px}.head-actions{width:100%}.head-actions button{flex:1 1 auto;min-height:46px}.stats{grid-template-columns:1fr 1fr}.inv-form{grid-template-columns:1fr}.inv-bar select{flex:1 1 100%}.stock-actions{grid-template-columns:1fr 1fr}.stock-dialog-actions{flex-direction:column-reverse}.stock-dialog-actions button{width:100%}}
.bk-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.bk-actions label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}.bk-actions input[type=checkbox]{width:auto;min-height:0}
.bk-note{border-left:3px solid var(--amber);padding:8px 12px;margin:12px 0 0;color:var(--muted);font-size:14px;background:rgba(255,176,32,.06);border-radius:0 10px 10px 0}
.bk-prev{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.3);font-size:14px}.bk-prev[hidden]{display:none}.bk-prev b{color:#fff}
.bk-row-actions{display:flex;gap:6px;flex-wrap:wrap}.bk-row-actions button{min-height:34px;padding:0 12px;font-size:13px}
.bk-file{padding:10px;min-height:48px}
@media print{body *{display:none}}
</style>
</head>
<body>
<header class="site-top"><img src="/icons/logo.jpg" alt=""><b>Bar On-line <span>do Cruzeiro</span></b><a class="store-link" id="to-store" href="/">← Voltar para a loja</a></header>
<div class="wrap"><div id="app"></div></div>
<script>
const $=s=>document.querySelector(s);
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let token=sessionStorage.getItem('bdc_admin')||'',tab='dash',timer,wtimer,lastMax=null,newCount=0,stockAlert=0,wt=0,ofilter='ativos',oq='';
async function api(path,opt={}){
  const r=await fetch('/api/admin/'+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&path!=='login'){token='';sessionStorage.removeItem('bdc_admin');login();throw new Error(j.error)}
  if(!r.ok)throw new Error(j.error||'Erro');return j;
}
function login(){
  clearInterval(timer);clearInterval(wtimer);wtimer=null;
  $('#app').innerHTML=`<div class="login-box"><span class="eyebrow">GESTÃO DO BAR</span><h2>Entrar no painel</h2><label for="pw" class="muted">Senha do painel</label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="e"></div><button class="p" id="go" style="width:100%;min-height:48px">Entrar</button></div>`;
  const go=async()=>{try{const j=await api('login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});token=j.token;sessionStorage.setItem('bdc_admin',token);shell()}catch(e){$('#e').textContent=e.message}};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
const snd=()=>{try{return localStorage.getItem('bdc_snd')!=='off'}catch(e){return true}};
function sndLabel(){const b=$('#snd');if(b)b.textContent=snd()?'🔔 Som: ligado':'🔕 Som: desligado'}
async function kpis(){
  try{
    const [per,all,st]=await Promise.all([api('reports/periods'),api('orders'),api('estoque/summary')]);
    const hoje=per[0]||{revenue:0,orders:0},mes=per[2]||{revenue:0,orders:0};
    const emAnd=all.filter(o=>['novo','preparando','saiu'].includes(o.status)).length,acab=(st.low||0)+(st.empty||0);
    const k=$('#kpis');if(!k)return;
    k.innerHTML=`<div class="kpi"><span>Faturamento do mês</span><strong>${brl(mes.revenue)}</strong><small>${mes.orders} pedidos não cancelados</small></div>
    <div class="kpi"><span>Hoje</span><strong>${brl(hoje.revenue)}</strong><small>${hoje.orders} pedido(s) hoje</small></div>
    <div class="kpi"><span>Pedidos em andamento</span><strong>${emAnd}</strong><small>Novos, preparando ou em entrega</small></div>
    <div class="kpi ${acab?'warn':''}"><span>Estoque acabando</span><strong>${acab}</strong><small>Produtos acabando ou esgotados</small></div>`;
  }catch(e){}
}
function shell(){
  $('#app').innerHTML=`<div class="page-head"><div><span class="eyebrow">GESTÃO DO BAR</span><h1>Painel do Bar do Cruzeiro</h1></div><div class="head-actions"><button id="snd"></button><button id="pause">…</button><button id="out">Sair</button></div></div>
  <div class="kpis" id="kpis"><div class="kpi"><span>Faturamento do mês</span><strong>…</strong></div><div class="kpi"><span>Hoje</span><strong>…</strong></div><div class="kpi"><span>Pedidos em andamento</span><strong>…</strong></div><div class="kpi"><span>Estoque acabando</span><strong>…</strong></div></div>
  <div class="tabs">${[['dash','Resumo'],['orders','Pedidos'+(newCount?' ('+newCount+')':'')],['products','Produtos'],['estoque','Estoque'+(stockAlert?' ('+stockAlert+')':'')],['brands','Marcas'],['zones','Bairros'],['reports','Relatórios'],['coupons','Cupons'],['customers','Clientes'],['cash','Caixa'],['settings','Funcionamento'],['backup','Backup']].map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div><div id="body"></div>`;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});
  $('#pause').onclick=togglePause;sndLabel();
  $('#snd').onclick=()=>{try{localStorage.setItem('bdc_snd',snd()?'off':'on')}catch(e){}sndLabel()};
  $('#out').onclick=()=>{clearInterval(wtimer);wtimer=null;token='';sessionStorage.removeItem('bdc_admin');login()};
  clearInterval(timer);kpis();
  if(!wtimer){watch();watchStock();wtimer=setInterval(()=>{watch();if(++wt%4===0){watchStock();kpis()}},15000)}
  ({dash,orders,products,estoque,brands,zones,reports,coupons,customers,cash,settings,backup})[tab]();
  refreshPause();
}
const ST=['novo','preparando','saiu','entregue','cancelado'];
function beep(){if(!snd())return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(a.currentTime+.5)}catch(e){}}
async function watch(){try{const r=await api('orders');const mx=Math.max(0,...r.map(o=>o.id));
  if(lastMax!==null&&mx>lastMax){beep();document.title='🔔 Novo pedido! — Painel';if(tab==='orders')orders()}
  lastMax=mx;newCount=r.filter(o=>o.status==='novo').length;
  const t=document.querySelector('[data-t=orders]');if(t)t.textContent='Pedidos'+(newCount?' ('+newCount+')':'')}catch(e){}}
async function dash(days=7){
  const s=await api('stats?days='+days),mx=Math.max(1,...s.byDay.map(d=>d.total));
  const list=(arr,f)=>arr.length?arr.map(f).join(''):'<p class="muted">Sem dados no período.</p>';
  $('#body').innerHTML=`<div class="chips">${[[1,'Hoje'],[7,'7 dias'],[30,'30 dias']].map(p=>`<button data-d="${p[0]}" class="${p[0]===days?'on':''}">${p[1]}</button>`).join('')}</div>
  <div class="cards"><div class="card"><span class="muted">Faturamento</span><b>${brl(s.revenue)}</b></div><div class="card"><span class="muted">Pedidos</span><b>${s.orders}</b></div><div class="card"><span class="muted">Ticket médio</span><b>${brl(s.avg)}</b></div><div class="card"><span class="muted">Cancelados</span><b>${s.cancelled}</b></div></div>
  <div class="box"><b>Vendas por dia</b><div class="bars">${s.byDay.map(d=>`<div title="${d.day.split('-').reverse().slice(0,2).join('/')}: ${brl(d.total)} (${d.n} pedidos)" style="height:${Math.max(2,d.total/mx*100)}%"></div>`).join('')}</div></div>
  <div class="box"><b>Mais vendidos</b>${list(s.top,t=>`<div class="row"><span>${esc(t.name)}</span><span>${t.qty} un · ${brl(t.total)}</span></div>`)}</div>

function optimizePhoto(file,max=800,png=false){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();reader.onerror=()=>reject(new Error('Não foi possível ler o arquivo.'));
    reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Arquivo de imagem inválido.'));
      img.onload=()=>{const scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');if(!png){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)}ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(png?canvas.toDataURL('image/png'):canvas.toDataURL('image/jpeg',0.8));};img.src=reader.result;};reader.readAsDataURL(file);
  });
}

const WD=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const PAYN={dinheiro:'Dinheiro',pix:'Pix',cartao:'Cartão'};
function repRows(items,key,label,sub,peakKey){
  if(!items.length)return '<p class="muted">Sem pedidos no período.</p>';
  const mx=Math.max(1,...items.map(x=>x[key])),pk=items.reduce((a,x)=>x[key]>a[key]?x:a,items[0]);
  return items.map(x=>`<div class="rb ${x===pk&&peakKey?'pk':''}"><span>${label(x)}</span><div><i style="width:${Math.max(3,x[key]/mx*100)}%"></i></div><b>${sub(x)}${x===pk&&peakKey?`<span class="badge">${peakKey}</span>`:''}</b></div>`).join('');
}

  <div class="chips">${[[7,'Últimos 7 dias'],[30,'Últimos 30 dias'],[90,'Últimos 90 dias']].map(p=>`<button data-rd="${p[0]}" class="${p[0]===days?'on':''}">${p[1]}</button>`).join('')}</div>
  <div class="cards"><div class="card"><span class="muted">Faturamento no período</span><b>${brl(s.revenue)}</b></div><div class="card"><span class="muted">Pedidos</span><b>${s.orders}</b></div><div class="card"><span class="muted">Ticket médio</span><b>${brl(s.average_ticket)}</b></div><div class="card"><span class="muted">Taxas de entrega</span><b>${brl(s.fees)}</b></div><div class="card"><span class="muted">Descontos de cupons</span><b>${brl(s.discounts)}</b><span class="muted">${s.coupon_orders} pedido(s) com cupom</span></div></div>
  <div class="box"><b>Faturamento por dia</b><div style="margin-top:8px">${d.daily.some(x=>x.orders)?d.daily.map(x=>`<div class="rb"><span>${x.day}</span><div><i style="width:${x.revenue?Math.max(3,x.revenue/mxDay*100):0}%"></i></div><b>${brl(x.revenue)}</b><small>${x.orders} pedido(s)</small></div>`).join(''):'<p class="muted">Sem vendas no período.</p>'}</div></div>

  <div class="box"><b>Horários de pico</b>${pkH?`<p class="muted">Pedidos por hora (horário de Brasília). Maior movimento: <b>${pkH.hour}h às ${(pkH.hour+1)%24}h</b>, com ${pkH.orders} pedido(s) — bom momento para reforçar a equipe e o estoque gelado.</p>`:''}${repRows(hours,'orders',h=>String(h.hour).padStart(2,'0')+'h',h=>h.orders+' · '+brl(h.revenue),'pico')}</div>
  <div class="box"><b>Dias da semana</b>${pkD?`<p class="muted">Dia mais movimentado: <b>${WD[pkD.dow]}</b> (${pkD.orders} pedido(s)).</p>`:''}${repRows(d.weekdays,'orders',x=>WD[x.dow].slice(0,3),x=>x.orders+' · '+brl(x.revenue),'mais movimentado')}</div>
  <div class="box"><b>Formas de pagamento</b>${d.payments.length?d.payments.map(x=>`<div class="row"><span>${esc(PAYN[x.payment]||x.payment)}</span><span>${x.orders} pedido(s) · ${brl(x.revenue)}</span></div>`).join(''):'<p class="muted">Sem pedidos no período.</p>'}</div>`;

const KIND={suprimento:'Entrada de dinheiro',sangria:'Retirada (sangria)',despesa:'Despesa paga do caixa'};

function toCents(t){const raw=String(t??'').trim().replace(/^R\$\s*/i,'');const n=/,/.test(raw)?raw.replace(/\./g,'').replace(',','.'):raw;
  return /^\d+(\.\d{1,2})?$/.test(n)?Math.round(Number(n)*100):null}
const when=d=>new Date(d).toLocaleString('pt-BR');
const diffTxt=c=>+c===0?'Caixa batendo ✓':+c>0?'Sobrou '+brl(c):'Faltou '+brl(-c);
const diffCls=c=>+c===0?'ok':+c>0?'over':'short';
function cashSummary(s){
  const rows=Object.entries(s.byMethod||{}).filter(([m,v])=>METHODS.includes(m)||v.orders>0).map(([m,v])=>`<tr><td>${esc(m)}</td><td>${v.orders}</td><td>${brl(v.totalCents)}</td></tr>`).join('');
  return `<div class="cards"><div class="card"><span class="muted">Troco inicial</span><b>${brl(s.openingCents)}</b></div><div class="card"><span class="muted">Vendas em dinheiro</span><b>${brl(s.cashSalesCents)}</b></div><div class="card"><span class="muted">Entradas / retiradas / despesas</span><b style="font-size:16px">+${brl(s.suppliesCents)} / −${brl(s.withdrawalsCents)} / −${brl(s.expensesCents)}</b></div><div class="card" style="border-color:var(--amber)"><span class="muted">Dinheiro que deve ter no caixa</span><b>${brl(s.expectedCashCents)}</b></div></div>

function cashMoves(list,canDel){
  if(!list.length)return '<p class="muted">Nenhum lançamento ainda.</p>';

function cashReport(r,title){
  const s=r.session;
  return `<div class="box"><b>${esc(title)}</b><p class="muted">Aberto em ${when(s.opened_at)} por ${esc(s.opened_by)}${s.closed_at?' · Fechado em '+when(s.closed_at)+' por '+esc(s.closed_by):''}</p>${cashSummary(r.summary)}
  ${s.closed_at?`<div class="result ${diffCls(s.difference_cents)}"><span>Esperado ${brl(s.expected_cents)} · Contado ${brl(s.counted_cents)}</span><span>${diffTxt(s.difference_cents)}</span></div>${s.open_notes?`<p class="muted">Obs. na abertura: ${esc(s.open_notes)}</p>`:''}${s.close_notes?`<p class="muted">Obs. no fechamento: ${esc(s.close_notes)}</p>`:''}`:''}
  <b>Lançamentos</b>${cashMoves(r.movements,false)}<button data-cprint="${s.id}" style="margin-top:8px">🖨️ Imprimir relatório</button></div>`;

function printCash(r){
  const s=r.session,m=r.summary,ln=(a,b)=>`${String(a).padEnd(18)}${String(b).padStart(14)}`;
  const meth=Object.entries(m.byMethod||{}).filter(([k,v])=>METHODS.includes(k)||v.orders>0).map(([k,v])=>ln(k+' ('+v.orders+')',brl(v.totalCents))).join('\n');

RELATÓRIO DE CAIXA
--------------------------------
Abertura: ${when(s.opened_at)}
${esc(s.opened_by)}
${s.closed_at?'Fechamento: '+when(s.closed_at)+'\n'+esc(s.closed_by):'Caixa ainda aberto'}

VENDAS
${esc(meth)}
${ln('Total vendido',brl(m.totalSalesCents))}

DINHEIRO
${ln('Troco inicial',brl(m.openingCents))}
${ln('Vendas em dinheiro',brl(m.cashSalesCents))}
${ln('Entradas','+'+brl(m.suppliesCents))}
${ln('Retiradas','-'+brl(m.withdrawalsCents))}
${ln('Despesas','-'+brl(m.expensesCents))}
${ln('ESPERADO',brl(m.expectedCashCents))}${s.closed_at?'\n'+ln('Contado',brl(s.counted_cents))+'\n*** '+diffTxt(s.difference_cents)+' ***'+(s.close_notes?'\nObs.: '+esc(s.close_notes):''):''}
--------------------------------
LANÇAMENTOS

    <div class="box"><b>Lançar movimento</b><div class="grid"><label class="muted">Tipo<select id="c-kind"><option value="sangria">Retirada (sangria)</option><option value="despesa">Despesa paga do caixa</option><option value="suprimento">Entrada de dinheiro</option></select></label><label class="muted">Valor (R$)<input id="c-amt" inputmode="decimal" placeholder="Ex.: 20,00"></label><label class="muted">Motivo<input id="c-reason" maxlength="200" placeholder="Ex.: compra de gelo"></label>${by}</div><button class="p" id="c-move-go">Lançar</button><div class="err" id="c-err"></div>${cashMoves(cur.movements,true)}</div>

async function watchStock(){try{const s=await api('estoque/summary');stockAlert=s.low+s.empty;const t=document.querySelector('[data-t=estoque]');if(t)t.textContent='Estoque'+(stockAlert?' ('+stockAlert+')':'')}catch(e){}}
const UL={un:'un.',kg:'kg',g:'g',l:'L',ml:'ml'},MV={entrada:'Compra',saida:'Retirada',perda:'Perda',conferencia:'Correção de saldo',ajuste:'Ajuste',venda:'Baixa de pedido',devolucao:'Devolução'},MS={entrada:'+',devolucao:'+',saida:'−',perda:'−',venda:'−'};
const unitLabel=u=>UL[u]||u||'',nf=(n,max=3)=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:max}),toNum=v=>Number(String(v??'').trim().replace(',','.'));
const positive=(v,l)=>{const n=toNum(v);if(!Number.isFinite(n)||n<=0)throw new Error(l+' precisa ser maior que zero.');return n};
const nonNeg=(v,l)=>{const n=toNum(v===''?0:v);if(!Number.isFinite(n)||n<0)throw new Error(l+' não pode ser negativo.');return n};
let sFilter={q:'',st:'all'},sItems=[];
function stStatus(i){const q=i.quantity,cap=Math.max(i.capacity||0,q),m=i.minimum||0,p=cap>0?Math.max(0,Math.min(100,q/cap*100)):0;
  if(q<=0)return{key:'empty',label:'Esgotado',percent:0};if((m>0&&q<=m)||p<=20)return{key:'low',label:'Está acabando',percent:p};return{key:'good',label:'Estoque bom',percent:p}}
/* Aviso flutuante (visível mesmo com a página rolada) */
let toastT;function notify(msg,type='ok'){let el=document.getElementById('stock-toast');if(!el){el=document.createElement('div');el.id='stock-toast';el.className='stock-toast';el.setAttribute('role','status');document.body.append(el)}
  el.textContent=msg;el.classList.toggle('error',type==='error');el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},type==='error'?8000:4500)}
/* Diálogo único para todas as ações: onSubmit pode lançar Error (a mensagem aparece nele e o digitado é mantido). Resolve true se concluiu. */
function openDialog({eyebrow,title,description,fields=[],submitLabel='Salvar',danger=false,onSubmit}){
  return new Promise(resolve=>{
    const dlg=document.createElement('dialog');dlg.className='stock-dialog';
    dlg.innerHTML=`<form class="stock-dialog-form"><div><span class="eyebrow">${esc(eyebrow)}</span><h3>${esc(title)}</h3></div>${description?`<p class="stock-dialog-desc">${esc(description)}</p>`:''}${fields.map((f,i)=>{
      const ctl=f.type==='select'?`<select name="${f.name}">${f.options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(f.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`
        :`<input name="${f.name}" type="${f.type==='number'?'number':'text'}" ${f.type==='number'?`step="${f.step||'any'}" inputmode="${f.step==='1'?'numeric':'decimal'}" min="0"`:''} ${f.maxLength?`maxlength="${f.maxLength}"`:''} placeholder="${esc(f.placeholder||'')}" value="${esc(f.value??'')}" ${f.required?'required':''} autocomplete="off">`;
      return `<label class="stock-field">${esc(f.label)}${f.suffix?`<div class="stock-field-row">${ctl}<strong class="stock-unit-tag">${esc(f.suffix)}</strong></div>`:ctl}${f.hint?`<small>${esc(f.hint)}</small>`:''}</label>`}).join('')}
      <p class="stock-dialog-error" role="alert"></p><div class="stock-dialog-actions"><button type="button" data-cancel>Cancelar</button><button type="submit" class="${danger?'danger':'p'}">${esc(submitLabel)}</button></div></form>`;
    document.body.append(dlg);
    const form=dlg.querySelector('form'),err=dlg.querySelector('.stock-dialog-error'),sub=form.querySelector('[type=submit]');let done=false;
    const finish=v=>{if(done)return;done=true;if(dlg.open)dlg.close();dlg.remove();resolve(v)};
    form.querySelector('[data-cancel]').onclick=()=>finish(false);
    dlg.addEventListener('cancel',e=>{e.preventDefault();finish(false)});dlg.addEventListener('click',e=>{if(e.target===dlg)finish(false)});
    form.onsubmit=async e=>{e.preventDefault();err.textContent='';const v={};for(const f of fields)v[f.name]=form.elements[f.name].value;
      sub.disabled=true;const t=sub.textContent;sub.textContent='Salvando…';
      try{await onSubmit(v);finish(true)}catch(x){err.textContent=x.message||'Não foi possível concluir. Tente novamente.';sub.disabled=false;sub.textContent=t}};
    dlg.showModal();const first=form.querySelector('input,select');if(first&&!danger){first.focus();if(first.select)first.select()}else form.querySelector('[data-cancel]').focus();
  });
}
const mvApi=(item,type,body)=>api('estoque/movements',{method:'POST',body:JSON.stringify({itemId:item.id,type,...body})});

      {name:'minimum',label:'Avisar quando restar até',type:'number',step:stepOf(item),value:item.minimum||0,hint:'Na unidade do estoque. 0 usa só o medidor (20% da quantidade cheia).'},
      {name:'capacity',label:'Quantidade cheia (100% do medidor)',type:'number',step:stepOf(item),value:Math.max(item.capacity||0,item.quantity||0),hint:'Use para reiniciar o medidor depois de uma compra grande ou de uma correção.'}],
    submitLabel:'Salvar alterações',onSubmit:v=>{const name=v.name.trim();if(name.length<2)throw new Error('Informe o nome do produto.');return api('estoque/items/'+item.id,{method:'PATCH',body:JSON.stringify({name,unit:v.unit,minimum:nonNeg(v.minimum,'O alerta'),capacity:nonNeg(v.capacity,'A quantidade cheia')})})}})},
  async del(item){return openDialog({eyebrow:'EXCLUIR PRODUTO',title:`Excluir “${item.name}”?`,description:'O produto sai da lista de estoque. O histórico de compras e movimentações é preservado, e o produto do cardápio com o mesmo nome (se houver) volta a vender sem controle de estoque.',submitLabel:'Excluir produto',danger:true,onSubmit:()=>api('estoque/items/'+item.id,{method:'DELETE'})})}
};
const DONE={buy:i=>'Compra registrada em '+i.name+'.',count:i=>'Saldo de '+i.name+' atualizado.',out:()=>'Retirada registrada.',edit:()=>'Produto atualizado.',del:i=>i.name+' foi excluído do estoque. O histórico foi mantido.'};

    <div class="stock-actions"><button type="button" class="p" data-act="buy">＋ Adicionar compra</button><button type="button" data-act="count">Corrigir saldo</button><button type="button" data-act="out">Retirar / perda</button><button type="button" data-act="edit">Editar</button><button type="button" class="d" data-act="del">Excluir</button></div></article>`};
  const list=()=>{const q=sFilter.q.trim().toLowerCase(),r=items.filter(i=>(!q||i.name.toLowerCase().includes(q))&&(sFilter.st==='all'||stStatus(i).key===sFilter.st));

    <p class="muted" style="margin:12px 0 0">Se o nome for igual ao de um produto do cardápio (ex.: Heineken Latão), o estoque fica <strong>ligado</strong> a ele: cada pedido desconta as unidades na hora, o cancelamento devolve, o site avisa “Os 3 últimos!” e mostra “Esgotado” quando zera. Produto do cardápio sem item aqui vende sem limite. Itens que não são vendidos (gelo, copos…) ficam só com controle manual.</p></div>

/* ---------- Backup ---------- */
const BK_TABLES={products:'Produtos',brands:'Marcas',zones:'Bairros',orders:'Pedidos',customers:'Clientes',customer_favorites:'Favoritos dos clientes',coupons:'Cupons',inventory_items:'Itens do estoque',inventory_movements:'Movimentos do estoque',cash_sessions:'Caixas (aberturas)',cash_movements:'Movimentos do caixa',settings:'Configurações'};
const BK_KIND={auto:'Automática',manual:'Manual','antes-de-restaurar':'Antes de restaurar'};
const bkName=t=>BK_TABLES[t]||t;
const bkSize=b=>b>=1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';
const bkWhen=d=>new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
function bkExpired(){token='';sessionStorage.removeItem('bdc_admin');login()}
async function bkSave(path,btn){
  const old=btn.textContent;btn.disabled=true;btn.textContent='Preparando…';
  try{
    const r=await fetch('/api/admin/backup/'+path,{headers:{Authorization:'Bearer '+token}});
    if(r.status===401){bkExpired();return}
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||'Não foi possível gerar o arquivo.')}
    const name=(/filename="([^"]+)"/.exec(r.headers.get('Content-Disposition')||'')||[])[1]||'backup.json';
    const url=URL.createObjectURL(await r.blob()),a=document.createElement('a');
    a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
    notify('Arquivo baixado: '+name);
  }catch(x){notify(x.message,'error')}finally{btn.disabled=false;btn.textContent=old}
}
async function bkPost(path,body,word){
  const r=await fetch('/api/admin/backup/'+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,'X-Confirm':word},body});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){bkExpired();throw new Error('Sessão expirada. Entre novamente.')}
  if(!r.ok)throw new Error(j.error||'Não foi possível restaurar o backup.');
  return j;
}
async function bkRestore(description,send){
  let out=null;
  const ok=await openDialog({eyebrow:'RESTAURAR BACKUP',title:'Restaurar este backup?',description,
    fields:[{name:'c',label:'Para confirmar, digite RESTAURAR',type:'text',required:true,placeholder:'RESTAURAR'}],submitLabel:'Restaurar agora',danger:true,
    onSubmit:async v=>{if(v.c.trim().toUpperCase()!=='RESTAURAR')throw new Error('Digite a palavra RESTAURAR para confirmar.');out=await send('RESTAURAR')}});
  if(ok&&out){notify(`Backup restaurado: ${out.rows} registros em ${out.tables} tabelas. O que existia antes ficou guardado em uma cópia de segurança.`);shell()}
}
const BK_WARN='Isto SUBSTITUI todos os dados atuais (pedidos, produtos, clientes, estoque, caixa e configurações) pelos do backup. Antes, o sistema guarda uma cópia do que existe agora, mas o ideal é restaurar sem pedidos em andamento.';
async function backup(){

  const snaps=s.snapshots,total=s.tables.reduce((n,t)=>n+t.rows,0);
  $('#body').innerHTML=`<div class="box"><b>Baixar backup completo</b>
    <p class="muted">Um arquivo .json com tudo: produtos, marcas, bairros, pedidos, clientes, cupons, estoque, caixa e configurações. Guarde no seu computador ou no Google Drive.</p>
    <div class="bk-actions"><button class="p" id="bk-dl">⬇ Baixar backup</button><label><input type="checkbox" id="bk-img" checked> Incluir fotos e logos enviadas pelo painel</label></div>
    <p class="bk-note">Sem as fotos o arquivo fica bem menor, mas ao restaurar as fotos enviadas pelo painel não voltam. O arquivo tem dados dos clientes (nome, telefone, endereço): não compartilhe.</p>
    <div class="bk-actions"><button id="bk-csv">⬇ Pedidos em planilha (CSV)</button><span class="muted">Abre no Excel e no Google Planilhas. Serve para consulta, não para restaurar.</span></div></div>

    <div class="box"><b>Cópias guardadas no sistema</b>
    <p class="muted">O sistema faz uma cópia automática por dia (quando há movimento) e guarda as ${s.keep.auto} últimas. Você também pode criar uma agora, por exemplo antes de mexer em muitos produtos.</p>
    <div class="bk-actions"><button class="p" id="bk-snap">＋ Criar cópia agora</button><span class="muted">${snaps.length} cópia(s) · ${bkSize(s.snapshots_bytes)} · banco todo: ${bkSize(s.db_bytes)}</span></div>
    ${snaps.length?`<div class="tw"><table><thead><tr><th>Data</th><th>Tipo</th><th>Tamanho</th><th>Registros</th><th></th></tr></thead><tbody>${snaps.map(x=>`<tr data-id="${x.id}" data-when="${esc(bkWhen(x.created_at))}"><td>${bkWhen(x.created_at)}${x.note&&x.kind==='manual'&&x.note!=='Cópia manual'?`<div class="muted">${esc(x.note)}</div>`:''}</td><td>${esc(BK_KIND[x.kind]||x.kind)}</td><td>${bkSize(x.size_bytes)}</td><td>${x.rows_count}</td>
      <td><div class="bk-row-actions"><button data-a="dl">Baixar</button><button data-a="rs">Restaurar</button><button class="d" data-a="del">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted" style="margin-top:12px">Ainda não há cópias. A primeira automática aparece em breve, ou crie uma agora.</p>'}
    <p class="bk-note">Estas cópias ficam no mesmo banco de dados do site. Protegem contra erros (apagou um produto, mudou preços sem querer), mas não contra a perda do banco inteiro: por isso baixe o arquivo de vez em quando.</p></div>

    <div class="box"><b>Restaurar de um arquivo</b>
    <p class="muted">Escolha um arquivo de backup baixado aqui no painel.</p>
    <input type="file" id="bk-file" class="bk-file" accept=".json,application/json">
    <div class="bk-prev" id="bk-prev" hidden></div>
    <div class="bk-actions"><button class="d" id="bk-go" hidden>Restaurar este arquivo…</button></div></div>

    <div class="box"><b>O que entra no backup</b>
    <p class="muted">${total} registros hoje.</p>
    ${s.tables.map(t=>`<div class="row"><span>${esc(bkName(t.name))}</span><span>${t.rows}</span></div>`).join('')}</div>`;

  $('#bk-dl').onclick=e=>bkSave('download?images='+($('#bk-img').checked?'1':'0'),e.currentTarget);
  $('#bk-csv').onclick=e=>bkSave('orders.csv',e.currentTarget);
  $('#bk-snap').onclick=async e=>{
    const b=e.currentTarget;b.disabled=true;b.textContent='Criando…';
    try{await api('backup/snapshots',{method:'POST',body:JSON.stringify({note:'Cópia manual'})});notify('Cópia criada.');await backup()}
    catch(x){notify(x.message,'error');b.disabled=false;b.textContent='＋ Criar cópia agora'}
  };
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
    const tr=b.closest('tr'),id=tr.dataset.id,when=tr.dataset.when;
    if(b.dataset.a==='dl')return bkSave('snapshots/'+id+'/download',b);
    if(b.dataset.a==='rs')return bkRestore(`Cópia de ${when}. ${BK_WARN}`,w=>bkPost('snapshots/'+id+'/restore','{}',w));
    if(await openDialog({eyebrow:'EXCLUIR CÓPIA',title:'Excluir esta cópia?',description:`A cópia de ${when} será apagada do sistema. Isso não afeta os dados atuais do site.`,submitLabel:'Excluir cópia',danger:true,
      onSubmit:()=>api('backup/snapshots/'+id,{method:'DELETE'})})){notify('Cópia excluída.');await backup()}
  });
  let fileText=null,fileMeta=null;
  $('#bk-file').onchange=async e=>{
    const f=e.target.files[0],prev=$('#bk-prev'),go=$('#bk-go');fileText=fileMeta=null;go.hidden=true;
    if(!f){prev.hidden=true;return}
    prev.hidden=false;prev.textContent='Lendo o arquivo…';
    try{
      const text=await f.text(),j=JSON.parse(text);
      if(j.app!=='bar-online-cruzeiro'||!j.tables||typeof j.tables!=='object')throw new Error('Este arquivo não é um backup do Bar On-line do Cruzeiro.');
      fileText=text;fileMeta=j;
      const names=Object.keys(j.tables).filter(t=>Array.isArray(j.tables[t]));
      prev.innerHTML=`<b>Backup de ${esc(bkWhen(j.created_at))}</b> · ${esc(bkSize(f.size))}<br>${names.map(t=>`${esc(bkName(t))}: ${j.tables[t].length}`).join(' · ')}${j.images===false?'<br><span class="over">Este backup foi feito sem fotos: as fotos enviadas pelo painel não voltam.</span>':''}`;
      go.hidden=false;
    }catch(x){prev.innerHTML=`<span class="short">${esc(x instanceof SyntaxError?'Não consegui ler o arquivo. Use o .json baixado pelo próprio painel.':x.message)}</span>`}
  };
  $('#bk-go').onclick=()=>{if(fileText)bkRestore(`Backup de ${bkWhen(fileMeta.created_at)}. ${BK_WARN}`,w=>bkPost('restore',fileText,w))};
}

token?shell():login();
</script>
</body>
</html>
