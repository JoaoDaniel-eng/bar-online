services:
  - type: web
    name: bar-online-cruzeiro
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WHATSAPP_NUMBER
        sync: false
      - key: STORE_NAME
        value: Bar On-line do Cruzeiro
